[project]
name = "malamoneyball-agent"
version = "0.1.0"
description = "A terminal fantasy football assistant that answers lineup questions from Razzball weekly projections."
readme = "README.md"
authors = [
    { name = "Michael Malamud", email = "mike.malamud@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.158.0",
    "openai-agents>=0.22.3",
    "pandas>=3.1.0",
    "platformdirs>=4.13.5",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
malamoneyball-agent = "malamoneyball_agent.terminal:main"
malamoneyball-web = "malamoneyball_agent.web:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "types-requests>=2.33.0.20260906",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# pycodestyle, pyflakes, import sorting, pyupgrade, bugbear, simplify
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
files = ["src", "tests"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
check_untyped_defs = true
